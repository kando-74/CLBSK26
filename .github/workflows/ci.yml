name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Lint
        run: npm run lint
        env:
          CI: '1'

      - name: Type check
        run: npm run typecheck
        env:
          CI: '1'

      - name: Unit tests
        run: npm run test -- --run --reporter=dot
        env:
          CI: '1'
          VITEST_POOL: 'forks'
